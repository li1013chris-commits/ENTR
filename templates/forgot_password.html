{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="page">
  <div class="form-card" style="max-width:400px">
    <h1 class="form-title" data-i18n="forgotpassword.title"></h1>
    <p class="form-subtitle" data-i18n="forgotpassword.subtitle"></p>

    <form method="POST">
      <div class="form-group">
        <label data-i18n="login.email"></label>
        <input type="email" name="email" required>
        <div class="form-hint" data-i18n="forgotpassword.hint"></div>
      </div>

      <div style="display:flex; gap:12px; flex-wrap:wrap">
        <button type="submit" class="btn btn-primary" data-i18n="forgotpassword.submit"></button>
        <a href="{{ url_for('login') }}" class="btn btn-secondary" data-i18n="common.back"></a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
