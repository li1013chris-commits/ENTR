{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="page">
  <div class="form-card" style="max-width:400px">
    <h1 class="form-title" data-i18n="resetpassword.title"></h1>

    <form method="POST">
      <input type="hidden" name="token" value="{{ token }}">

      <div class="form-group">
        <label data-i18n="login.password"></label>
        <input type="password" name="new_password" id="password" required minlength="8">
        <div id="strength" style="margin-top:8px; font-size:13px">
          <span data-i18n="password.weak"></span>
        </div>
        <div class="form-hint" data-i18n="password.hint"></div>
      </div>

      <div class="form-group">
        <label data-i18n="resetpassword.confirm"></label>
        <input type="password" id="confirm" required minlength="8">
      </div>

      <div style="display:flex; gap:12px; flex-wrap:wrap">
        <button type="submit" class="btn btn-primary" data-i18n="resetpassword.submit"></button>
        <a href="{{ url_for('login') }}" class="btn btn-secondary" data-i18n="common.back"></a>
      </div>
    </form>
  </div>
</div>

<script>
const pwd = document.getElementById('password');
const confirm = document.getElementById('confirm');
const strength = document.getElementById('strength');

pwd.addEventListener('input', function() {
  const val = this.value;
  let level = 'weak';
  let color = '#dc2626';

  if (val.length >= 8) {
    const hasUpper = /[A-Z]/.test(val);
    const hasLower = /[a-z]/.test(val);
    const hasNum = /[0-9]/.test(val);
    const hasSpecial = /[!@#$%^&*]/.test(val);

    if ((hasUpper || hasLower) && hasNum) {
      level = 'ok';
      color = '#d97706';
    }
    if (hasUpper && hasLower && hasNum && hasSpecial) {
      level = 'strong';
      color = '#16a34a';
    }
  }

  strength.style.color = color;
  strength.textContent = level.charAt(0).toUpperCase() + level.slice(1);
});

document.querySelector('form').addEventListener('submit', function(e) {
  if (pwd.value !== confirm.value) {
    e.preventDefault();
    alert('Passwords do not match');
  }
});
</script>
{% endblock %}
